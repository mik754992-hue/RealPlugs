name: build-from-zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No .zip file found in the repo root" >&2
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p _build
          unzip -q "$ZIP" -d _build
          SETTINGS=$(find _build -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle inside the zip" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: realplugs-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
